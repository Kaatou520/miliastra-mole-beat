name: Deploy demo

# 把 web/ 直接部署成 GitHub Pages（纯静态，无需构建步骤）
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # action 大版本要跟着 GitHub 走：v3/v4 那代读不到新 artifact，会报
      # "No artifacts named github-pages were found"
      - uses: actions/checkout@v7

      # Pages 已经开好（源 = GitHub Actions）；如果换成新仓库要先在 Settings → Pages 里点一次
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
          # web/.nojekyll 是隐藏文件，默认不会进 artifact
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
